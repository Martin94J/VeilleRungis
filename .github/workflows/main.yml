name: Mise à jour

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:         # permet de le lancer à la main

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests beautifulsoup4

      - name: Lancer le script
        run: python scrape.py

      - name: Enregistrer data.json
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Mise à jour des données" && git push)
